<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Ali Ramzi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.7;
            max-width: 700px;
            margin: 0 auto;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.8rem;
            color: #2d3748;
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 700;
        }

        .intro-box {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
            font-size: 1.1rem;
            line-height: 1.8;
            text-align: center;
        }

        .intro-box strong {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Ali Ali Ramzi's Website</h1>
        
        <div class="intro-box">
            <strong>Hello! I'm Ali Ali Ramzi</strong>
            This is my website where I wanted to share with you my experiences, research, projects, and useful things that can benefit you. Enjoy your time with me!
        </div>
    </div>
</body>
</html>
